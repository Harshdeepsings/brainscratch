  <!-- Typography -->
  <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Brainscratch</text>
  <text x="600" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#c084fc" text-anchor="middle">Your Second Brain for Bookmarks, Notes &amp; Media</text>
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">Save YouTube videos, X/Twitter threads, Google Docs &amp; Notion links in one private, fast workspace.</text>

  <!-- Feature Pills -->
  <g transform="translate(260, 440)">
