      <path stroke="#A855F7" d="M96 61c-9 8-8 23 2 29m-42 9c12-3 22 5 22 17m-6 42c10-8 23-5 28 5m18-107c-5 10-3 20 6 26m-6 30c-10-2-18 5-18 15m14 20c-8 7-8 18-2 25"/>
