    <text x="75" y="26" font-family="sans-serif" font-size="15" font-weight="600" fill="#f8fafc" text-anchor="middle">YouTube</text>

    <rect x="170" y="0" width="150" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
