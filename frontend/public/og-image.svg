  <g transform="translate(540, 90) scale(0.47)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
      <path stroke="#A855F7" d="M119 42c-10-14-31-16-44-5-9 7-13 18-12 29-16 2-28 16-28 33 0 10 5 19 13 25-10 8-14 22-9 35 5 14 17 22 32 22 5 17 20 28 37 26 8-1 15-5 20-11V55c-3-5-6-9-9-13Z"/>
